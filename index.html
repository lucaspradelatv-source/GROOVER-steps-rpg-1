
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071326">
<title>GROOVERSTEP'S RPG</title>

<style>
:root {
  --bg: #071326;
  --panel: #101f38;
  --blue: #2864a8;
  --light: #8bc5ff;
  --text: #edf5ff;
  --muted: #a8b8ce;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(5, 15, 30, .95);
  border-bottom: 1px solid #263d5c;
  backdrop-filter: blur(10px);
}

.nav {
  max-width: 1150px;
  margin: auto;
  padding: 16px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.logo {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 2px;
  color: white;
}

.logo span {
  color: var(--light);
}

nav {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

nav a {
  color: var(--muted);
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
}

nav a:hover {
  color: white;
  background: #1b3557;
}

section {
  max-width: 1150px;
  margin: auto;
  padding: 65px 22px;
  scroll-margin-top: 75px;
}

.hero {
  min-height: 440px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  background:
    radial-gradient(ellipse at 80% 20%, #174b79 0%, transparent 40%),
    linear-gradient(130deg, #08172c, #102c4c 65%, #071326);
  max-width: none;
  padding-left: max(22px, calc((100% - 1106px) / 2));
  padding-right: 22px;
}

.hero h1 {
  max-width: 750px;
  font-size: clamp(36px, 7vw, 68px);
  line-height: 1.05;
  margin-bottom: 18px;
}

.hero h1 span {
  color: var(--light);
}

.hero p {
  max-width: 570px;
  color: #c2d4e9;
  font-size: 17px;
  margin-bottom: 25px;
}

.primary-button {
  border: 0;
  background: #397fc5;
  color: white;
  padding: 13px 20px;
  border-radius: 9px;
  font-weight: bold;
  text-decoration: none;
  display: inline-block;
}

.primary-button:hover {
  background: #559ce5;
}

.section-title {
  font-size: 30px;
  margin-bottom: 8px;
}

.section-description {
  color: var(--muted);
  margin-bottom: 25px;
}

.rpg-list {
  display: flex;
  gap: 17px;
  overflow-x: auto;
  padding: 8px 3px 20px;
  scroll-snap-type: x mandatory;
  scrollbar-color: #397fc5 #10213a;
}

.rpg-card {
  flex: 0 0 270px;
  min-height: 220px;
  padding: 22px;
  border-radius: 15px;
  border: 1px solid #29476c;
  background: linear-gradient(145deg, #172d4b, #0c1a30);
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.rpg-card h3 {
  font-size: 23px;
  margin-bottom: 9px;
}

.rpg-card p {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 20px;
}

.rpg-card button {
  margin-top: auto;
  border: 1px solid #578bc1;
  background: transparent;
  color: white;
  border-radius: 7px;
  padding: 9px 14px;
}

.rpg-card button:hover {
  background: #244c77;
}

.panel {
  background: var(--panel);
  border: 1px solid #263e5d;
  border-radius: 15px;
  padding: 24px;
  margin-top: 18px;
}

.panel p {
  color: var(--muted);
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 17px;
}

.news-box {
  background: #122440;
  border: 1px solid #29476c;
  border-radius: 12px;
  padding: 20px;
}

.news-box h3 {
  margin-bottom: 9px;
}

.news-box p {
  color: var(--muted);
}

.trailer-area {
  margin-top: 22px;
  background: #050d19;
  border: 1px solid #29476c;
  border-radius: 14px;
  overflow: hidden;
}

.trailer-area video {
  display: block;
  width: 100%;
  max-height: 520px;
  background: #000;
}

.trailer-placeholder {
  min-height: 190px;
  display: grid;
  place-content: center;
  text-align: center;
  padding: 25px;
  color: var(--muted);
}

.trailer-placeholder strong {
  color: white;
  font-size: 20px;
  margin-bottom: 7px;
}

.hidden {
  display: none !important;
}

#game {
  max-width: 1150px;
}

.game-instructions {
  color: var(--muted);
  margin-bottom: 15px;
}

.game-stage {
  width: 100%;
  height: 330px;
  overflow: hidden;
  position: relative;
  border: 2px solid #314d70;
  border-radius: 12px;
  background: #102542;
}

.world {
  width: 1500px;
  height: 100%;
  position: absolute;
  left: 0;
  top: 0;
  overflow: hidden;
  background: linear-gradient(#142c4d 0%, #253e5c 67%, #35533f 68%, #253e30 100%);
  transition: background .3s;
}

.cloud {
  position: absolute;
  width: 100px;
  height: 23px;
  background: #9aafc4;
  border-radius: 30px;
  opacity: .35;
}

.cloud::before {
  content: "";
  position: absolute;
  width: 43px;
  height: 40px;
  background: inherit;
  border-radius: 50%;
  left: 20px;
  top: -18px;
}

.cloud.one { left: 180px; top: 55px; }
.cloud.two { left: 670px; top: 95px; }
.cloud.three { left: 1050px; top: 42px; }

.red-fog {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(130, 15, 25, .1) 35%, rgba(180, 20, 28, .75) 100%);
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s;
}

.ground-decoration {
  position: absolute;
  bottom: 65px;
  color: #b5c4a1;
  font-size: 24px;
}

.player {
  position: absolute;
  bottom: 65px;
  left: 90px;
  width: 30px;
  height: 47px;
  z-index: 4;
  image-rendering: pixelated;
}

.player-head {
  position: absolute;
  top: 0;
  left: 6px;
  width: 19px;
  height: 17px;
  background: #e4b
